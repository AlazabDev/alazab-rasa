# ════════════════════════════════════════════════════════════
#  deploy/production/nginx/bot.alazab.com.conf
#  AzaBot — bot.alazab.com | chat.alazab.com
#
#  Routes:
#    /              → Frontend SPA (azabot/dist)
#    /chat          → FastAPI Webhook (127.0.0.1:8000)
#    /admin         → FastAPI Admin (127.0.0.1:8000)
#    /health        → FastAPI Health
#    /webhook/*     → Incoming webhooks (Meta/Telegram)
#    /static/       → Static files
#    /embed/        → Embed script (CORS open)
#    /brands        → Brand API
#    /lead          → Lead endpoint
#
#  Security:
#    - Rate limiting per endpoint
#    - Security headers
#    - HTTPS only
#    - No server tokens
# ════════════════════════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=chat_api:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin_api:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_in:10m  rate=120r/m;
limit_req_zone $binary_remote_addr zone=global:10m      rate=200r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream
upstream azabot_webhook {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bot.alazab.com www.bot.alazab.com chat.alazab.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bot.alazab.com$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.alazab.com www.bot.alazab.com chat.alazab.com;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/bot.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.alazab.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                                    always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "microphone=(self), camera=(), geolocation=()"  always;
    add_header X-Request-ID              $request_id                                     always;

    # ── General ──────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 20M;
    limit_conn addr 30;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxies any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Frontend root
    root /opt/azabot/azabot/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/azabot_access.log combined;
    error_log  /var/log/nginx/azabot_error.log warn;

    # ── Health Check ─────────────────────────────────────────
    location = /health {
        access_log off;
        limit_req zone=global burst=10 nodelay;
        proxy_pass http://azabot_webhook/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ── Chat API ─────────────────────────────────────────────
    location /chat {
        limit_req zone=chat_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://azabot_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Admin Panel ──────────────────────────────────────────
    location /admin {
        limit_req zone=admin_api burst=20 nodelay;

        # تقييد الوصول لـ IPs المعتمدة (اختياري — علّق لو تريد وصول عام)
        # allow 197.48.0.0/16;   # مصر
        # deny all;

        proxy_pass http://azabot_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Incoming Webhooks (Meta + Telegram) ──────────────────
    location /webhook/ {
        limit_req zone=webhook_in burst=30 nodelay;

        proxy_pass http://azabot_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # ── Lead + Brands API ────────────────────────────────────
    location ~ ^/(lead|brands) {
        limit_req zone=global burst=20 nodelay;

        proxy_pass http://azabot_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ── Static Files (uploads) ───────────────────────────────
    location /static/ {
        limit_req zone=global burst=50 nodelay;

        alias /opt/azabot/webhook/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "https://alazab.com";

        # منع تشغيل PHP/scripts
        location ~* \.(php|sh|py|pl|cgi)$ {
            return 403;
        }
    }

    # ── Embed Script (CORS open للمواقع الخارجية) ────────────
    location /embed/ {
        limit_req zone=global burst=100 nodelay;

        alias /opt/azabot/webhook/static/widget/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # ── API Docs (تعطيل في الإنتاج) ──────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        # علّق السطر التالي لو تريد الـ docs
        return 404;
    }


    # ── UberFix Bot Gateway ───────────────────────────────────
    location /uberfix/ {
        limit_req zone=webhook_in burst=30 nodelay;

        proxy_pass http://azabot_webhook;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # ── Frontend SPA ─────────────────────────────────────────
    location / {
        limit_req zone=global burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
