[project]
name = "alazab-group-rasa-bot"
version = "4.0.0"
description = "AzaBot — Rasa Pro CALM chatbot for Alazab Group (5 brands)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Rasa
  "rasa-pro[nlu]>=3.16,<3.17",
  "rasa-sdk>=3.16,<3.17",
  # Web
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  # HTTP
  "httpx>=0.27.0",
  # Data
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  # AI
  "openai>=1.0.0",
  # Database
  "supabase>=2.0.0",
  "PyJWT>=2.8.0",
  # System
  "psutil>=5.9.0",
  "bcrypt>=4.0.0",
  # Compat
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["actions", "actions.*", "webhook", "webhook.*"]
exclude = ["data*", "domain*", "docs*", "logs*", "tests*", "scratch*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
