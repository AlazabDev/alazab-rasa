responses:
  utter_help_menu:
    - text: |
        📚 **دليل المساعدة من مجموعة العزب**
        كيف يمكنني مساعدتك اليوم؟
        يمكنك أن تطلب المساعدة في المجالات التالية:
        
        • **العزب لخدمات الإنشاءات والتشطيبات والمشروعات المعمارية:** (اكتب مثلاً: "عايز ابني عمارة"، "أسعار التشطيب"، "تصميم هوية تجارية")
        • **التشطيبات الراقية:** (اكتب مثلاً: "معاينة مجانية"، "أسعار التشطيب")
        • **هوية العلامات:** (اكتب مثلاً: "تصميم هوية تجارية")
        • **التوريدات والخامات:** (اكتب مثلاً: "خامات بناء وجملة")
        • **اوبرفيكس لخدمات الصيانات وإدارة المرافق:** (اكتب مثلاً: "طلب صيانة"، "أعطال التكييف"، "صيانة كهرباء")
        
        أو يمكنك التحدث معي مباشرة بما تبحث عنه، وسأوجهك فوراً للمختص.
