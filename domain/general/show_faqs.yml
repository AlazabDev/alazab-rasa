version: "3.1"
responses:
  utter_top_faqs:
    - text: |
        🔥 **أبرز الاستفسارات الشائعة:**
        💰 "كم سعر متر التشطيب أو البناء؟"
        ⏰ "ما هي المدة المتوقعة للتنفيذ؟"
        🔒 "هل تقدمون ضماناً على الأعمال؟"
        📍 "ما هي مناطق التغطية الجغرافية لكم؟"
        💳 "ما هي طرق وتسهيلات الدفع المتاحة؟"
  utter_ask_faq_topic:
    - text: |
        🔍 أي المواضيع التالية تود معرفة المزيد عنها؟
        1️⃣ الأسعار والتكاليف
        2️⃣ الجداول الزمنية
        3️⃣ الضمانات المقدمة
        4️⃣ طرق الدفع
        5️⃣ النطاق الجغرافي
  utter_faqs_menu:
    - text: |
        📚 **قائمة الأسئلة الشائعة**
        1️⃣ الأسعار
        2️⃣ المدة الزمنية
        3️⃣ الضمان
        4️⃣ طرق الدفع
        5️⃣ التغطية الجغرافية
  utter_faq_prices:
    - text: |
        💰 **نظرة عامة على الأسعار:**
        يرجى العلم أن هذه الأسعار هي مؤشرات مبدئية، وتخضع للتسعير النهائي بعد المعاينة وتحديد المواصفات الدقيقة لضمان أعلى معايير الجودة.
        • تكلفة البناء: تبدأ من 2,500 ج/م²
        • تكلفة التشطيب: تبدأ من 1,500 ج/م²
        • تصميم الهوية التجارية: يبدأ من 15,000 ج
        • كشفية الصيانة (اوبرفيكس): 300 ج
  utter_faq_timing:
    - text: |
        ⏰ **الجداول الزمنية التقريبية للتنفيذ:**
        • المشروعات الإنشائية الكبيرة: 12 إلى 18 شهراً
        • تشطيب الوحدات السكنية: 30 إلى 45 يوماً
        • تجهيز وبناء الهوية التجارية: 15 إلى 25 يوماً
        • استجابة طلبات الصيانة: خلال 24 ساعة
  utter_faq_warranty:
    - text: |
        🔒 **الضمانات:**
        ثقتنا بجودة عملنا تترجم إلى ضمانات موثقة:
        • الأعمال الإنشائية: ضمان هيكلي يصل إلى 10 سنوات
        • أعمال التشطيبات: ضمان شامل لمدة 3 سنوات
        • أعمال الصيانة: ضمان لمدة 3 أشهر على قطع الغيار والإصلاح
  utter_faq_payment:
    - text: |
        💳 **أنظمة الدفع المعتمدة:**
        نحرص على مرونة السداد من خلال:
        • الدفع عند الاستلام (لخدمات الصيانة السريعة)
        • التحويلات البنكية المباشرة
        • الدفع الإلكتروني (إنستا باي - بطاقات ائتمان)
        • أنظمة تقسيط مريحة للمشروعات الكبيرة
  utter_faq_location:
    - text: |
        📍 **النطاق الجغرافي للخدمة:**
        تمتد خدماتنا لتغطي:
        • القاهرة الكبرى بالكامل
        • الإسكندرية والمناطق الساحلية
        • مدن الأقاليم الرئيسية
        • صعيد مصر (بحسب حجم المشروع)
  utter_ask_more_faqs:
    - text: "هل أستطيع توضيح أي استفسارات أخرى لك؟"
  utter_thanks_for_faq:
    - text: "🙏 يسعدني دائماً تزويدك بالمعلومات. لا تتردد إن احتجت لأي مساعدة إضافية!"
  utter_ask_faq_keyword:
    - text: "🔎 يرجى كتابة كلمة مفتاحية للبحث ضمن دليلنا. مثال: 'تكلفة'، 'ضمان'."
  utter_search_results:
    - text: |
        📋 **نتائج البحث عن "{keyword}":**
        {results}
  utter_no_faq_results:
    - text: "عذراً، لم أتمكن من العثور على نتائج تتطابق مع '{keyword}'. هل يمكنك تجربة كلمة بحث مختلفة أو التحدث لأحد الممثلين؟"
actions:
  - action_search_faq_by_keyword
