version: "3.1"
slots:
  maintenance_client_name:
    type: text
    mappings:
      - type: custom
  maintenance_client_phone:
    type: text
    mappings:
      - type: custom
  maintenance_service_type:
    type: text
    mappings:
      - type: custom
  maintenance_description:
    type: text
    mappings:
      - type: custom
  maintenance_priority:
    type: text
    mappings:
      - type: custom
  maintenance_request_id:
    type: text
    mappings:
      - type: custom
  maintenance_request_number:
    type: text
    mappings:
      - type: custom
  maintenance_status:
    type: text
    mappings:
      - type: custom
  maintenance_stage:
    type: text
    mappings:
      - type: custom
responses:
  utter_ask_maintenance_client_name:
    - text: "ما اسم العميل/الفرع؟"
  utter_ask_maintenance_client_phone:
    - text: "ما رقم هاتف العميل أو إدارة الفرع؟"
  utter_ask_maintenance_service_type:
    - text: "ما نوع خدمة الصيانة المطلوبة؟ (مثال: كهرباء، سباكة، تكييف...)"
  utter_ask_maintenance_description:
    - text: "يرجى وصف المشكلة أو طلب الصيانة بالتفصيل."
  utter_ask_maintenance_priority:
    - text: "ما أولوية الطلب؟ (عالية، متوسطة، منخفضة)"
  utter_ask_maintenance_request_id:
    - text: "ما رقم الطلب أو المعرف؟"
  utter_maintenance_request_created:
    - text: "تم إنشاء طلب الصيانة بنجاح. رقم الطلب: {maintenance_request_number}"
  utter_maintenance_status:
    - text: "حالة الطلب الحالية: {maintenance_status}"
  utter_maintenance_triaged:
    - text: "تمت مراجعة طلبك وسيتم تعيين فني قريباً."
  utter_maintenance_assigned:
    - text: "تم تعيين الفني، وسيتم التواصل معك قريباً."

