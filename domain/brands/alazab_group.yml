responses:
  utter_alazab_about:
  - text: '🏢 **العزب لخدمات الإنشاءات والتشطيبات والمشروعات المعمارية**


      الكيان الرئيسي لمجموعة العزب، متخصص في الإدارة الهندسية المتكاملة للمشروعات.

      • **الإنشاءات**: عمارات وفلل ومنشآت تجارية.

      • **الإدارة الفنية**: الإشراف الكامل على المواقع.

      • **التطوير العقاري**: إدارة وتطوير المشروعات.


      ✅ نفذنا 125 فرعاً تجارياً وعمارات سكنية ضخمة.

      تحب تعرف تفاصيل أكتر أو اجهزلك عرض سعر؟

      '
  utter_brand_services:
  - text: '💎 **Brand Identity — بناء واكتمال الهوية**


      نحن متخصصون في تصميم وتجسيد "جوهر العلامة التجارية":

      • **تصميم الهوية**: رسم الشخصية البصرية.

      • **تجهيز وتأسيس (Fit-out)**: التنفيذ الهندسي المتكامل.

      • **تصنيع الوحدات**: إنتاج وحدات العرض.

      • **تسليم مفتاح**: نسلمك المحل مكتملاً وجاهزاً.


      تحب نبدأ في تصميم هويتك ولا محتاج تنفيذ وتجهيز؟

      '
  utter_luxury_services:
  - text: '✨ **Luxury Finishing**

      متخصصون في:

      • تشطيب الوحدات السكنية الراقية والفلل.

      • التصميم الداخلي الفاخر.

      • أرضيات رخام إيطالي وبورسلان مستورد.

      • حوائط وحلول ديكور ذكية.


      عايز تعرف باقات التشطيب ولا تشوف سابقة الأعمال؟

      '
  utter_laban_products:
  - text: '🧱 **منتجات Laban Alasfour المتوفرة:**

      • مواد بناء أساسية (طوب، أسمنت، حديد)

      • خامات تشطيب (رخام، سيراميك، دهانات)

      • مستلزمات تأسيس (كابلات، مواسير، لوازم كهرباء وسباكة)


      قولي محتاج إيه والكمية كام؟

      '
