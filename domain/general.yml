responses:
  utter_bot_challenge:
  - text: '🤖 أنا AzaBot، المساعد الذكي لمجموعة العزب!

      أنا نظام ذكاء اصطناعي هنا لمساعدتك في خدمات الشركة.

      كيف يمكنني مساعدتك اليوم؟

      '
  utter_ask_help:
  - text: '📚 كيف يمكنني مساعدتك اليوم؟


      يمكنك أن تسألني عن:

      • المقاولات: "عايز ابني عمارة"

      • التشطيب: "أسعار التشطيب"

      • الهوية التجارية: "تصميم هوية"

      • الصيانة: "طلب صيانة أوبرفيكس"

      • التوريدات: "خامات بناء وجملة"

      '
  utter_out_of_scope:
  - text: '🙏 عذراً، هذا الموضوع خارج نطاق خدماتنا.

      أنا متخصص في خدمات مجموعة العزب فقط.

      هل يمكنني مساعدتك في شيء آخر؟

      '
  utter_session_start:
  - text: '👋 مرحباً! أنا AzaBot، مساعدك الذكي من مجموعة العزب.

      كيف يمكنني خدمتك اليوم؟

      '
  utter_ask_reason_for_handoff:
  - text: '👤 سأحولك إلى أحد ممثلي خدمة العملاء.

      قبل ذلك، ما هو سبب رغبتك في التحدث مع ممثل؟

      '
  utter_offer_human_handoff:
  - text: '👤 يسعدنا تحويلك إلى ممثل خدمة العملاء.

      هل تريد الانتظار أو التحدث مع ممثل الآن؟

      '
    buttons:
    - title: نعم، تحويل الآن
      payload: /affirm
    - title: لا، شكراً
      payload: /deny
  utter_human_handoff_immediate:
  - text: '✅ ممتاز! ممثل خدمة العملاء سيتحدث معك الآن.

      برجاء الانتظار لحظة...

      '
  utter_human_handoff_queue:
  - text: '⏳ أنت في قائمة الانتظار.

      رقمك في الطابور: {queue_position}

      سيصلك ممثل قريباً، برجاء الانتظار.

      '
  utter_agent_connected:
  - text: '🎉 تم الاتصال بممثل خدمة العملاء!

      سيتولى خدمتك الآن. شكراً لصبرك.

      '
  utter_human_handoff_offline:
  - text: '😔 للأسف جميع ممثلينا مشغولون حالياً.

      أوقات عملنا: السبت–الخميس 9ص–10م

      '
  utter_offer_alternative_contact:
  - text: 'هل تريد التواصل عبر واتساب مباشرة؟

      '
    buttons:
    - title: نعم، واتساب
      payload: /affirm
    - title: لا شكراً
      payload: /deny
  utter_provide_whatsapp:
  - text: '📱 تواصل معنا على واتساب:

      +201000000000

      فريقنا سيرد عليك في أقرب وقت.

      '
  utter_handoff_cancelled:
  - text: 'تمام! بقيت معي 😊

      هل يمكنني مساعدتك في شيء آخر؟

      '
  utter_receive_escalation:
  - text: '📋 سأرفع مشكلتك للمدير المسؤول.

      من فضلك أخبرني بتفاصيل المشكلة.

      '
  utter_escalate_to_manager:
  - text: '✅ تم إرسال مشكلتك للمدير المسؤول.

      سيتواصل معك خلال 24 ساعة عمل.

      '
  utter_ask_lead_info:
  - text: '📋 يسعدنا اهتمامك بخدماتنا!

      لتحويل بياناتك لفريق المبيعات، أحتاج بعض المعلومات.

      '
  utter_ask_lead_confirmation:
  - text: '📋 هل هذه البيانات صحيحة؟

      الاسم: {user_name}

      الهاتف: {user_phone}

      الموقع: {location}

      الخدمة: {service_type}

      '
    buttons:
    - title: ✅ نعم، صحيح
      payload: /affirm
    - title: ❌ لا، تعديل
      payload: /deny
  utter_lead_captured:
  - text: '✅ تم استلام بياناتك بنجاح!

      سيتواصل معك أحد مهندسينا خلال 24 ساعة عمل.

      شكراً لاهتمامك بمجموعة العزب.

      '
  utter_ask_restart_collection:
  - text: 'هل تريد البدء من جديد لتعديل البيانات؟

      '
    buttons:
    - title: نعم، ابدأ من جديد
      payload: /affirm
    - title: لا، إنهاء
      payload: /deny
  utter_ask_feedback:
  - text: 'هل تريد:

      1️⃣ تقييم الخدمة (1–5 نجوم)

      2️⃣ اقتراح تطوير

      3️⃣ مشاركة تجربتك

      '
    buttons:
    - title: ⭐ تقييم الخدمة
      payload: /provide_rating
    - title: 💡 اقتراح
      payload: /provide_suggestion
    - title: 📝 مشاركة تجربة
      payload: /give_feedback
  utter_ask_which_service:
  - text: '🔧 أي خدمة تقيمها؟

      '
    buttons:
    - title: Alazab Construction
      payload: '/provide_rating{"feedback_service": "alazab"}'
    - title: Luxury Finishing
      payload: '/provide_rating{"feedback_service": "luxury"}'
    - title: Brand Identity
      payload: '/provide_rating{"feedback_service": "brand"}'
    - title: UberFix
      payload: '/provide_rating{"feedback_service": "uberfix"}'
    - title: Laban Alasfour
      payload: '/provide_rating{"feedback_service": "laban"}'
  utter_ask_rating:
  - text: '⭐ قيم خدمتنا من 1 إلى 5:


      1⭐ سيء جداً

      2⭐ سيء

      3⭐ متوسط

      4⭐ جيد

      5⭐ ممتاز

      '
    buttons:
    - title: 5 ⭐⭐⭐⭐⭐
      payload: '/provide_rating{"rating": 5}'
    - title: 4 ⭐⭐⭐⭐
      payload: '/provide_rating{"rating": 4}'
    - title: 3 ⭐⭐⭐
      payload: '/provide_rating{"rating": 3}'
    - title: 2 ⭐⭐
      payload: '/provide_rating{"rating": 2}'
    - title: 1 ⭐
      payload: '/provide_rating{"rating": 1}'
  utter_ask_feedback_details:
  - text: 📝 شاركنا تجربتك بالتفصيل. ماذا أعجبك أو لم يعجبك؟
  utter_ask_suggestion_details:
  - text: 💡 شاركنا اقتراحك لتطوير الخدمة. نحن نسمعك!
  utter_ask_follow_up_contact:
  - text: '🙏 نأسف على تجربتك. هل تسمح لنا بالتواصل معك لحل المشكلة؟

      '
    buttons:
    - title: نعم، تواصلوا معي
      payload: /affirm
    - title: لا شكراً
      payload: /deny
  utter_positive_feedback:
  - text: 😊 يسعدنا جداً أنك راضٍ عن خدمتنا. شكراً لك!
  utter_negative_apology:
  - text: 🙏 نأسف على تجربتك السيئة. سنعمل على تحسين الخدمة فوراً.
  utter_neutral_feedback:
  - text: 📝 شكراً لرأيك. نعمل باستمرار على تحسين خدماتنا.
  utter_thanks_for_feedback:
  - text: 📝 شكراً لمشاركتنا تجربتك. رأيك يصنع الفرق لنا.
  utter_thanks_for_suggestion:
  - text: 💡 شكراً لاقتراحك القيّم. سندرسه ونعمل على تطبيقه.
  utter_thanks:
  - text: عفواً! أنا دائماً في خدمتك 😊
  utter_default_fallback:
  - text: عذراً، لم أفهم ذلك جيداً. هل يمكنك إعادة صياغة سؤالك؟
  utter_clarification_no_options_rasa:
  - text: عذراً، أحتاج لمزيد من التوضيح.
  utter_clarification_options_rasa:
  - text: هل تقصد أحد الخيارات التالية؟
  utter_no_relevant_answer_found:
  - text: لم أتمكن من العثور على إجابة مناسبة في الوقت الحالي.
  utter_help_menu:
  - text: كيف يمكنني مساعدتك؟ يمكنك السؤال عن خدماتنا ومشاريعنا.
  utter_faq_location:
  - text: نحن متواجدون ونقدم خدماتنا في العديد من المحافظات!
  utter_faq_payment:
  - text: نقبل الدفع النقدي والتحويلات البنكية.
  utter_faq_prices:
  - text: تختلف الأسعار حسب نوع الخدمة. يرجى إمدادنا بالتفاصيل لنعطيك عرض سعر.
  utter_faq_timing:
  - text: الوقت يعتمد على حجم المشروع وسنزودك بجدول زمني مفصل بعد المعاينة.
  utter_faq_warranty:
  - text: نقدم ضماناً شاملاً على جميع أعمالنا.
  utter_top_faqs:
  - text: '🔥 الأسئلة الأكثر شيوعاً:


      💰 "كم سعر التشطيب للمتر؟"

      ⏰ "كام المدة الزمنية للبناء؟"

      🔒 "عندكم ضمان على الشغل؟"

      📍 "بتشتغلوا في أي محافظات؟"

      💳 "ايه طرق الدفع المتاحة؟"

      '
  utter_ask_faq_topic:
  - text: '🔍 أي موضوع تريد معرفة المزيد عنه؟

      '
    buttons:
    - title: 💰 الأسعار
      payload: /ask_faq_prices
    - title: ⏰ المدة الزمنية
      payload: /ask_faq_timing
    - title: 🔒 الضمان
      payload: /ask_faq_warranty
    - title: 💳 طرق الدفع
      payload: /ask_faq_payment
    - title: 📍 التغطية الجغرافية
      payload: /ask_faq_location
  utter_faqs_menu:
  - text: '📚 الأسئلة الشائعة — اختر موضوعاً:

      '
    buttons:
    - title: 💰 الأسعار
      payload: /ask_faq_prices
    - title: ⏰ المدة الزمنية
      payload: /ask_faq_timing
    - title: 🔒 الضمان
      payload: /ask_faq_warranty
    - title: 💳 طرق الدفع
      payload: /ask_faq_payment
    - title: 📍 التغطية
      payload: /ask_faq_location
  utter_ask_more_faqs:
  - text: هل تريد الاستفسار عن موضوع آخر؟
    buttons:
    - title: نعم
      payload: /affirm
    - title: لا، شكراً
      payload: /deny
  utter_thanks_for_faq:
  - text: 🙏 أتمنى أن أكون قد أجبت على استفسارك. أنا هنا إذا احتجت أي مساعدة.
  utter_ask_faq_keyword:
  - text: '🔎 اكتب كلمة مفتاحية عن ما تبحث عنه (مثل: سعر، ضمان، توصيل...):'
  utter_search_results:
  - text: '📋 نتائج البحث عن "{keyword}":


      {results}

      '
  utter_no_faq_results:
  - text: '😕 لم أجد نتائج لبحثك عن "{keyword}".

      حاول كلمة أخرى أو اختر من القائمة.

      '
  utter_confirm_cancel:
  - text: 'هل أنت متأكد من الإلغاء؟

      '
    buttons:
    - title: نعم، إلغاء
      payload: /affirm
    - title: لا، تراجع
      payload: /deny
  utter_transferring_to_human:
  - text: سيتم تحويلك الآن إلى أحد أفراد فريقنا البشري خلال لحظات.
  - text: You will be transferred to a human agent in a few moments.
    channel: browser_audio
  utter_human_handoff_cancelled:
  - text: تم إلغاء التحويل. هل ترغب في المساعدة في شيء آخر؟
    metadata:
      rephrase: true
  - text: Ok, I understand you don't want to be connected to a human agent. Is there
      something else I can help you with?
    channel: browser_audio
    metadata:
      rephrase: true
  utter_ask_maintenance_client_name:
  - text: ما اسم العميل/الفرع؟
  utter_ask_maintenance_client_phone:
  - text: ما رقم هاتف العميل أو إدارة الفرع؟
  utter_ask_maintenance_service_type:
  - text: 'ما نوع خدمة الصيانة المطلوبة؟ (مثال: كهرباء، سباكة، تكييف...)'
  utter_ask_maintenance_description:
  - text: يرجى وصف المشكلة أو طلب الصيانة بالتفصيل.
  utter_ask_maintenance_priority:
  - text: ما أولوية الطلب؟ (عالية، متوسطة، منخفضة)
  utter_ask_maintenance_request_id:
  - text: ما رقم الطلب أو المعرف؟
  utter_maintenance_request_created:
  - text: 'تم إنشاء طلب الصيانة بنجاح. رقم الطلب: {maintenance_request_number}'
  utter_maintenance_status:
  - text: 'حالة الطلب الحالية: {maintenance_status}'
  utter_maintenance_triaged:
  - text: تمت مراجعة طلبك وسيتم تعيين فني قريباً.
  utter_maintenance_assigned:
  - text: تم تعيين الفني، وسيتم التواصل معك قريباً.
  utter_placeholder:
  - text: 'عذراً، هذه الخاصية قيد التطوير.

      يمكنني مساعدتك في خدمات مجموعة العزب مباشرة — فقط أخبرني بما تحتاجه.

      '
  utter_cannot_handle:
  - text: 'لم أتمكن من معالجة طلبك بشكل صحيح.

      جرّب إعادة الصياغة، أو اكتب «مساعدة» لأرى كيف أخدمك.

      '
  utter_ask_rephrase:
  - text: ممكن تعيد صياغة طلبك بشكل مختلف؟ حاول تكون أكثر تحديداً. 🙏
  utter_maintenance_intro:
  - text: أهلاً بك في خدمة عملاء الصيانة المعمارية. أنا المساعد الذكي لشركة العزب.
      كيف يمكنني مساعدتك اليوم؟
  utter_ask_client_full_name:
  - text: يرجى تزويدنا بالاسم الكامل لصاحب البلاغ.
  utter_ask_client_phone:
  - text: ما هو رقم هاتفك للتواصل؟
  utter_ask_property_address:
  - text: يرجى تزويدنا بعنوان العقار بالكامل (المنطقة، الشارع، رقم المبنى، الدور).
  utter_ask_issue_description:
  - text: يرجى وصف المشكلة أو العطل بشكل تفصيلي.
  utter_ask_issue_type:
  - text: ما هو نوع العطل الذي تواجهه؟ (سباكة/كهرباء/إنشائية/تشطيبات/تكييف/نجارة)
    buttons:
    - title: سباكة
      payload: /SetSlots(issue_type=plumbing)
    - title: كهرباء
      payload: /SetSlots(issue_type=electrical)
    - title: إنشائية
      payload: /SetSlots(issue_type=structural)
    - title: تشطيبات
      payload: /SetSlots(issue_type=finishing)
    - title: تكييف
      payload: /SetSlots(issue_type=hvac)
    - title: نجارة
      payload: /SetSlots(issue_type=carpentry)
  utter_ask_emergency_level:
  - text: ما هي درجة الطوارئ؟
    buttons:
    - title: عاجل
      payload: /SetSlots(emergency_level=urgent)
    - title: خلال 24 ساعة
      payload: /SetSlots(emergency_level=within_24h)
    - title: خلال أسبوع
      payload: /SetSlots(emergency_level=within_week)
    - title: غير عاجل
      payload: /SetSlots(emergency_level=not_urgent)
  utter_ask_preferred_visit_time:
  - text: ما هو الوقت المناسب لزيارة المهندس؟
  utter_ask_issue_images_url:
  - text: هل يمكنك مشاركة رابط لصور المشكلة (إن وجدت)؟
  utter_ask_maintenance_request_number:
  - text: يرجى تزويدي برقم الطلب أو رقم الهاتف للاستعلام عن الحالة.
  utter_confirm_maintenance_request:
  - text: 'تم استلام جميع البيانات، جاري إنشاء طلب الصيانة الآن. ستصلك رسالة عبر واتساب
      عند إنشاء الطلب بنجاح. شكراً لتواصلك مع شركة العزب.

      '
  utter_confirm_daftra_sync:
  - text: تم مزامنة حسابك مع دفترة بنجاح.
  utter_invoice_created:
  - text: 'تم إصدار الفاتورة بنجاح. يمكنك مراجعتها عبر الرابط التالي: {daftra_document_url}'
  utter_invoice_failed:
  - text: تعذر إصدار الفاتورة. يرجى المحاولة لاحقاً أو مراجعة خدمة العملاء.
  utter_status_not_found:
