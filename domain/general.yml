responses:
  utter_alazab_master_welcome:
  - text: '👋 أهلاً بك في مساعد مجموعة العزب الذكي.

      أنا هنا لتوجيهك بسرعة بين خدمات: المقاولات، تجهيز الفروع، التشطيب الراقي، الصيانة، والتوريدات.


      اختر المسار المناسب:

      1️⃣ Alazab Construction — مقاولات وإدارة تنفيذ

      2️⃣ Brand Identity — تجهيز فروع وهوية تجارية

      3️⃣ Luxury Finishing — تشطيب راقٍ

      4️⃣ UberFix — صيانة وتشغيل

      5️⃣ Laban Alasfour — توريدات وخامات


      اكتب الخدمة المطلوبة، وسأحوّل طلبك للمسار الصحيح.

      '
  utter_maintenance_fast_start:
  - text: 'تمام يا مدير.

      خلينا نسجل الطلب صح من أول مرة.


      اكتب لي بالترتيب:

      • اسم الفرع

      • نوع العطل أو البند

      • درجة الخطورة: عادي / مهم / عاجل

      • صورة أو فيديو إن وجد


      بعدها أجهز الطلب لمسار الصيانة المناسب.

      '
  utter_route_to_human_with_summary:
  - text: 'تم استلام طلبك.

      لو الموضوع يحتاج تدخل بشري، سأجهز ملخصًا واضحًا للفريق يشمل: الخدمة، الموقع، درجة الأولوية، والتفاصيل الأساسية.


      اكتب آخر تفصيلة ناقصة وسأكمل التحويل.

      '
  utter_session_start:
  - text: '👋 مرحباً! أنا AzaBot، مساعدك الذكي من مجموعة العزب.

      كيف يمكنني خدمتك اليوم؟'
  utter_clarification_no_options_rasa:
  - text: 'محتاج تفاصيل أكتر عشان أوجّهك صح.

      اكتب هل تقصد: خدمات، عرض سعر، مراحل التنفيذ، أو أعمال سابقة؟'
  utter_clarification_options_rasa:
  - text: 'أقدر أساعدك، لكن محتاج تحدد المقصود.

      اختر الأقرب لطلبك: {{context.clarification_options}}'
  utter_no_knowledge_base:
  - text: 'لا توجد لدي معلومة كافية عن النقطة دي حالياً.

      أقدر أساعدك في خدمات مجموعة العزب أو أوصّل طلبك للفريق المختص.'
  utter_alazab_about:
  - text: '🏢 **Alazab Construction — التميز المعماري**


      الكيان الرئيسي لمجموعة العزب، متخصص في الإدارة الهندسية المتكاملة للمشروعات.


      • **الإنشاءات**: بناء العمارات والفلل والمنشآت التجارية.

      • **الإدارة الفنية**: الإشراف الكامل على المواقع والجداول الزمنية.

      • **التجهيزات (Fit-out)**: تشطيبات متكاملة للمباني الإدارية والسكنية.

      • **التطوير العقاري**: إدارة وتطوير المشروعات من الأرض حتى التسليم.


      ✅ تنفيذ **125 فرعاً تجارياً** لسلاسل عالمية وإقليمية.

      ✅ إنشاء عمارات سكنية متكاملة في القاهرة الجديدة والتجمع.


      لتقديم عرض سعر دقيق، يرجى تزويدنا بـ:

      • نوع المشروع (سكني/تجاري).

      • المساحة الكلية.

      • هل توجد مقايسة معتمدة أم ترغب في عمل مقايسة جديدة؟

      '
  utter_brand_services:
  - text: '💎 **Brand Identity — بناء واكتمال الهوية**


      نحن متخصصون في تصميم وتجسيد "جوهر العلامة التجارية" لسلاسل الفروع والشركات:

      • **تصميم الهوية**: رسم الشخصية البصرية وجوهر العلامة التجارية.

      • **تجهيز وتأسيس (Fit-out)**: التنفيذ الهندسي المتكامل.

      • **تصنيع الوحدات**: إنتاج وحدات العرض والأثاث المخصص.

      • **تسليم على الفرش**: نسلمك المحل مكتملاً وجاهزاً لعرض منتجاتك فوراً.


      لأننا نصمم "جوهر الهوية"، يرجى تزويدنا بـ:

      • مساحة الفرع أو المشروع.

      • نوع النشاط التجاري.

      • هل تحتاج تصميم فقط أم تنفيذ "تسليم مفتاح"؟

      '
  utter_luxury_services:
  - text: '✨ **Luxury Finishing** متخصصة في:

      • تشطيبات الوحدات السكنية الراقية

      • التصميم الداخلي الفاخر

      • الإشراف الدقيق على التنفيذ

      • أرضيات: رخام إيطالي، بورسلان فاخر

      • حوائط: دهانات Jotun، ورق حائط إيطالي

      • ديلوكس: من 2500 ج/م²

      • سوبر لوكس: من 4500 ج/م²

      '
  utter_laban_products:
  - text: '🧱 **منتجات Laban Alasfour المتوفرة:**

      • بناء (طوب، أسمنت، حديد)

      • تشطيب (رخام، سيراميك)

      • تأسيس (كابلات، مواسير)

      '
  utter_ask_branch_name:
  - text: 'تمام يا فندم، محتاج أعرف الصيانة دي لأي فرع؟ (مثلاً: فرع المعادي ش 9)'
  utter_ask_service_item:
  - text: سأساعدك في تنفيذ طلب الصيانة، ما هي تفاصيل العطل أو البند المطلوب صيانته؟
  utter_greet:
  - text: '👋 أهلاً وسهلاً! أنا عزبوت، مساعدك الذكي من مجموعة العزب.


      أقدر أساعدك في:

      🔧 صيانة UberFix  |  🏗️ مقاولات  |  ✨ تشطيب  |  🎨 هوية تجارية  |  📦 توريدات


      قولّي تحب نبدأ بإيه؟

      '
  - text: 'يا هلا! 🌟 أنا عزبوت، وأنا هنا عشان أريّحك وأحل كل حاجة بسرعة.


      مقاولات؟ تشطيب؟ صيانة؟ هوية تجارية؟ توريدات؟

      كلها في المكان الصح — قولّي تحب نبدأ بإيه! 🚀

      '
  utter_goodbye:
  - text: 'شكرًا لتواصلك مع مجموعة العزب 🤝

      سعداء بخدمتك دائمًا، وأي وقت تحتاجنا هتلاقينا معاك.

      '
  utter_thanks:
  - text: تحت أمرك في أي وقت 🤍 وجودك يهمنا!
  utter_bot_challenge:
  - text: 'أنا عزبوت 🤖، المساعد الذكي لمجموعة العزب!

      أنا هنا عشان أسهل عليك الوصول لكل خدماتنا.

      تحب نبدأ بإيه؟ 😊

      '
  utter_out_of_scope:
  - text: 'للأسف، النقطة دي بره تخصصي شوية 😅

      أنا شاطر في كل ما يخص خدمات مجموعة العزب (مقاولات، تشطيب، صيانة، توريدات).

      تحب أساعدك في حاجة تانية؟ 😊

      '
  utter_default_fallback:
  - text: 'محتاج أوضح الطلب معاك بشكل أدق.

      أقدر أساعدك في: الصيانة، التشطيب، المقاولات، الهوية التجارية، أو التوريدات.

      اكتبلي الخدمة المطلوبة بكلمة بسيطة، وأنا أكمّل معاك.

      '
  - text: 'يمكن الطلب وصلني بشكل غلط شوية 😅

      جرب تاني بكلمة واضحة مثلاً: "طلب صيانة"، "عرض سعر تشطيب"، أو "هوية تجارية".

      '
