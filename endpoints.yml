# ══════════════════════════════════════════════════════════════
# endpoints.yml — AzaBot Production Endpoints
# Rasa Pro CALM | No Docker | Local services behind Nginx/systemd
# ══════════════════════════════════════════════════════════════

# Actions server
action_endpoint:
  url: "${ACTION_SERVER_URL:-http://127.0.0.1:5055/webhook}"

nlg:
  type: rephrase

# Tracker Store → Supabase PostgreSQL
tracker_store:
  type: SQL
  dialect: postgresql
  url: "${DATABASE_URL}"

# Lock Store
# Redis is required for production-safe conversation locking.
lock_store:
  type: redis
  url: "${REDIS_HOST:-127.0.0.1}"
  port: ${REDIS_PORT:-6379}
  db: ${REDIS_LOCK_DB:-1}
  password: "${REDIS_PASSWORD:-}"
  use_ssl: ${REDIS_USE_SSL:-false}

# Model Groups — names must match config.yml
model_groups:
  - id: command_generator_llm
    models:
      - provider: openai
        model: ${OPENAI_COMMAND_MODEL:-gpt-4o-mini}
        timeout: ${OPENAI_COMMAND_TIMEOUT:-25}

  - id: enterprise_search_generation
    models:
      - provider: openai
        model: ${OPENAI_ENTERPRISE_SEARCH_MODEL:-gpt-4o-mini}
        timeout: ${OPENAI_ENTERPRISE_SEARCH_TIMEOUT:-20}

  - id: enterprise_search_embeddings
    models:
      - provider: openai
        model: ${OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-large}
        timeout: ${OPENAI_EMBEDDINGS_TIMEOUT:-15}

  - id: openai-gpt-4o
    models:
      - provider: openai
        model: ${OPENAI_GENERAL_MODEL:-gpt-4o}
        timeout: ${OPENAI_GENERAL_TIMEOUT:-30}

  - id: openai-gpt-4o-mini
    models:
      - provider: openai
        model: ${OPENAI_FAST_MODEL:-gpt-4o-mini}
        timeout: ${OPENAI_FAST_TIMEOUT:-20}
