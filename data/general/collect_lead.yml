version: '3.1'
flows:
  collect_lead:
    description: |
      جمع بيانات العميل المحتمل (lead) لأي براند. يستوعب أن المستخدم قد يذكر معلوماته في رسائل مختلفة ويبني صورة كاملة تلقائياً دون تكرار الأسئلة.
    name: collect lead
    steps:
    - action: action_accumulate_context
    - collect: user_name
      description: |
        اسم العميل. إذا ذُكر في أي رسالة سابقة لا تسأل مجدداً.
      ask_before_filling: false
      reset_after_flow_ends: false
    - collect: user_phone
      description: |
        رقم هاتف التواصل. إذا ذُكر سابقاً لا تسأل.
      ask_before_filling: false
      reset_after_flow_ends: false
    - action: action_build_full_request
    - collect: user_message
      description: |
        وصف الطلب أو الخدمة المطلوبة. يجمع تلقائياً من كل ما قاله المستخدم.
      ask_before_filling: false
      reset_after_flow_ends: false
    - action: action_submit_lead
      next: END
    if: 'False'
