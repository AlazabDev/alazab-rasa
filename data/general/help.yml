version: '3.1'
flows:
  show_help:
    description: يعرض خيارات المساعدة وكيفية استخدام البوت
    nlu_trigger:
    - intent: ask_help
    steps:
    - action: utter_help_menu
      next: END
responses:
  utter_help_menu:
  - text: 'كيف يمكنني مساعدتك؟

      • فتح طلب صيانة جديد ومتابعة حالته.

      • الاستعلام عن حالة الحساب أو آخر فاتورة أو حالة المشروع وأمر الشغل.

      • التعرف على خدمات مجموعة العزب.

      • طلب عرض سعر للمشروعات أو التشطيبات أو تجهيز الفروع.

      • الاستفسار عن التوريدات والوحدات.

      اكتب طلبك مباشرة وسأوجهك إلى المسار المناسب.'
