version: "3.1"
# ══════════════════════════════════════════════════════════════
# data/system/patterns/patterns.yml
# CALM System Patterns — Rasa Pro Built-in Flows
#
# هذه الـ patterns يُشغّلها CALM تلقائياً عند الحاجة
# عبر الـ commands: knowledge_answer, human_handoff, etc.
# ══════════════════════════════════════════════════════════════
flows:

  # ── البحث في قاعدة المعرفة (EnterpriseSearch) ─────────────
  # يُشغَّل عند: knowledge_answer command من LLM
  pattern_search:
    name: "البحث في قاعدة المعرفة"
    description: >
      يُستدعى عندما يطرح المستخدم سؤالاً يحتاج إجابة
      من قاعدة معرفة مجموعة العزب (خدمات، أسعار، مواصفات).
      يستخدم EnterpriseSearchPolicy مع data/services/.
    steps:
      - action: action_trigger_search
        next: END

  # ── لا يوجد إجابة ─────────────────────────────────────────
  pattern_cannot_handle:
    name: "لا توجد إجابة"
    description: >
      يُستدعى عندما لا يجد البوت إجابة في الـ flows
      أو قاعدة المعرفة.
    steps:
      - action: utter_no_relevant_answer_found
        next: END

  # ── اكتمال Flow ───────────────────────────────────────────
  pattern_completed:
    name: "اكتمال المهمة"
    description: "يُشغَّل عند اكتمال أي flow بنجاح"
    steps:
      - noop: true
        next: END

  # ── تصحيح Slot ────────────────────────────────────────────
  # يُشغَّل عند: correct slot command
  pattern_correction:
    name: "تصحيح المعلومات"
    description: "يسمح للمستخدم بتصحيح معلومة أخطأ فيها"
    steps:
      - action: action_correct_flow_slot
        next: END

  # ── توضيح (Clarification) ─────────────────────────────────
  # يُشغَّل عند: clarify command — عدة flows محتملة
  pattern_clarification:
    name: "توضيح الطلب"
    description: "يُستخدم عندما يكون طلب المستخدم محتملاً لأكثر من مسار"
    steps:
      - noop: true
        next:
          - if: context.names
            then: action_clarify_flows
          - else:
            - action: utter_clarification_no_options_rasa
              next: END
      - id: action_clarify_flows
        action: action_clarify_flows
      - action: utter_clarification_options_rasa

  # ── بداية الجلسة ─────────────────────────────────────────
  pattern_session_start:
    name: "بداية المحادثة"
    description: "ترحيب بالمستخدم عند بدء المحادثة"
    steps:
      - action: action_session_start
        next: END

  # ── إلغاء Flow ────────────────────────────────────────────
  # يُشغَّل عند: cancel flow command
  pattern_cancel_flow:
    name: "إلغاء العملية"
    description: "يسمح للمستخدم بإلغاء الطلب الحالي"
    steps:
      - action: utter_confirm_cancel
        next:
          - if: "context.intent.name = 'affirm'"
            then: END
          - else: END

  # ── Human Handoff ─────────────────────────────────────────
  # يُشغَّل عند: human handoff command
  pattern_human_handoff:
    name: "التحويل لموظف"
    description: "يحوّل المحادثة لموظف بشري"
    steps:
      - action: action_human_handoff
        next: END

  # ── Chitchat ──────────────────────────────────────────────
  # يُشغَّل عند: chitchat command
  pattern_chitchat:
    name: "محادثة عامة"
    description: "يتعامل مع المحادثات العامة والترحيب"
    steps:
      - action: utter_chitchat
        next: END
