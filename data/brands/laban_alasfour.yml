version: '3.1'
flows:
  laban_inquiry:
    description: 'عندما يسأل العميل عن الوحدات الخشبية أو التصاميم أو الأسعار، يُوجَّه
      فوراً لموقع laban-alasfour.alazab.com مع عرض جمع بياناته لمتابعة الفريق.

      '
    name: laban inquiry
    steps:
    - action: utter_laban_redirect_to_site
      next: offer_lead
    - id: offer_lead
      action: utter_laban_offer_contact
      next:
      - if: context.intent = "affirm"
        then: collect
      - if: context.intent = "deny"
        then: END
      - else: END
    - id: collect
      link: collect_lead
    nlu_trigger:
    - intent: ask_laban_products
  laban_products:
    description: يعرض منتجات وخامات Laban Alasfour
    name: laban products
    steps:
    - action: utter_laban_products
    - action: utter_laban_redirect_to_site
      next: END
  laban_catalog:
    description: يُوجّه لكتالوج Laban Alasfour
    name: laban catalog
    steps:
    - action: action_laban_show_catalog
    - action: utter_laban_redirect_to_site
      next: END
    nlu_trigger:
    - intent: ask_laban_catalog
  laban_delivery:
    description: يوضح خدمة التوصيل ويُوجّه للموقع
    name: laban delivery
    steps:
    - action: action_laban_check_delivery
    - action: utter_laban_redirect_to_site
      next: END
    nlu_trigger:
    - intent: ask_laban_delivery
  laban_bulk_order:
    description: يستقبل طلب توريد بالجملة ويجمع بيانات العميل
    name: laban bulk order
    steps:
    - action: action_laban_bulk_quote
    - link: collect_lead
    nlu_trigger:
    - intent: ask_laban_bulk_order
  laban_contact:
    description: يُوجّه للتواصل مع فريق Laban
    name: laban contact
    steps:
    - action: utter_laban_contact
      next: END
    nlu_trigger:
    - intent: ask_laban_contact
  supply_request:
    name: طلب توريد خامات
    description: 'تدفق لجمع بيانات التوريد والخامات المطلوبة، ثم تنفيذ أكشن إنشاء
      طلب التوريد.

      '
    steps:
    - collect: client_name
      utter: utter_ask_client_name
    - collect: supply_id
      utter: utter_ask_supply_id
    - collect: material_type
      utter: utter_ask_material_type
    - collect: quantity
      utter: utter_ask_quantity
    - collect: delivery_date
      utter: utter_ask_delivery_date
    - action: action_create_supply_request
    - action: utter_supply_request_created
  get_supply_status:
    name: استعلام حالة توريد
    description: 'تدفق للاستعلام عن حالة طلب التوريد.

      '
    steps:
    - collect: supply_id
      utter: utter_ask_supply_id
    - action: action_get_supply_status
    - action: utter_supply_status
