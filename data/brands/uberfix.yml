version: '3.1'
flows:
  uberfix_services:
    name: uberfix services
    description: يعرض فئات خدمات UberFix المتاحة للصيانة والتشغيل دون فتح طلب جديد.
    nlu_trigger:
    - intent: ask_uberfix_services
    steps:
    - action: utter_uberfix_services
      next: END
  uberfix_request:
    name: uberfix create maintenance request
    description: يفتح طلب صيانة جديدًا في UberFix. يجمع بيانات التواصل، فئة الخدمة،
      درجة الأولوية، وصف العطل، الموقع، والمرفقات الاختيارية، ثم يراجع البيانات مع
      العميل ويرسلها إلى بوابة الصيانة. لا ينشئ فاتورة عند فتح البلاغ.
    nlu_trigger:
    - intent: start_maintenance_request
    steps:
    - action: utter_maintenance_intro
    - action: action_accumulate_context
    - collect: user_name
      description: اسم العميل أو اسم الفرع صاحب البلاغ.
      ask_before_filling: false
      reset_after_flow_ends: false
    - collect: user_phone
      description: رقم هاتف صالح للتواصل ومتابعة الطلب.
      ask_before_filling: false
      reset_after_flow_ends: false
    - collect: issue_type
      description: 'فئة الخدمة: تكييف وتبريد، كهرباء وإضاءة، سباكة وصرف صحي، نجارة
        وأثاث، دهانات وتشطيبات، واجهة ولافتة، مطبخ ومعدات، أو أخرى.'
      ask_before_filling: false
    - collect: emergency_level
      description: 'درجة أولوية البلاغ: افتراضي أو عاجلة. عند طلب معاينة أو صيانة
        دورية تُذكر بوضوح في وصف الطلب.'
      ask_before_filling: false
    - collect: issue_description
      description: وصف واضح للعطل أو العمل المطلوب بما يساعد على إتمام الزيارة الأولى.
      ask_before_filling: false
    - collect: property_address
      description: موقع التنفيذ أو عنوان الفرع بوضوح.
      ask_before_filling: false
    - collect: issue_images_url
      description: صورة أو فيديو للعطل إن وجد. هذا الحقل اختياري ويمكن تجاوزه.
      ask_before_filling: false
    - collect: preferred_visit_time
      description: الموعد المناسب للزيارة إن كان لدى العميل تفضيل. هذا الحقل اختياري.
      ask_before_filling: false
    - action: utter_confirm_maintenance_request
    - action: action_build_full_request
    - action: action_uberfix_create_request
      next: END
  uberfix_track:
    name: uberfix track maintenance request
    description: يتحقق من حالة طلب صيانة قائم باستخدام رقم الطلب أو رقم المتابعة.
    nlu_trigger:
    - intent: ask_uberfix_tracking
    steps:
    - collect: order_number
      description: رقم طلب الصيانة أو رقم المتابعة.
      ask_before_filling: false
    - action: action_uberfix_track_request
      next: END
  uberfix_subscriptions:
    name: uberfix subscriptions
    description: يعرض معلومات الاشتراكات وخطط الصيانة الدورية المتاحة في UberFix.
    nlu_trigger:
    - intent: ask_uberfix_subscription
    steps:
    - action: action_uberfix_show_subscriptions
      next: END
  uberfix_emergency:
    name: uberfix emergency request
    description: يفتح بلاغ صيانة عاجل عندما يذكر العميل حالة طارئة تتطلب التعامل السريع.
    nlu_trigger:
    - intent: ask_uberfix_emergency
    steps:
    - set_slots:
      - emergency_level: عاجلة
    - link: uberfix_request
  maintenance_request:
    name: طلب صيانة عبر UberFix
    description: 'تدفق متكامل لجمع بيانات طلب الصيانة، تنفيذ الطلب، وإظهار رقم التتبع
      والرابط.

      '
    steps:
    - collect: client_name
      utter: utter_ask_client_name
    - collect: client_phone
      utter: utter_ask_client_phone
    - collect: service_type
      utter: utter_ask_service_type
    - collect: description
      utter: utter_ask_description
    - collect: priority
      utter: utter_ask_priority
    - action: action_create_maintenance_request
    - action: utter_request_created
  track_maintenance_request:
    name: تتبع حالة طلب صيانة
    description: 'تدفق للاستعلام عن حالة الطلب وعرض رابط التتبع.

      '
    steps:
    - collect: request_number
      utter: utter_ask_request_number
    - action: action_get_maintenance_status
    - action: utter_status
