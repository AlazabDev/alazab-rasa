version: "3.1"
# ══════════════════════════════════════════════════════════════
# data/flows/maintenance.yml
# تدفقات طلبات الصيانة عبر UberFix Bot Gateway
# ══════════════════════════════════════════════════════════════
flows:

  # ── إنشاء طلب صيانة جديد ────────────────────────────────────
  create_maintenance_request:
    description: >
      يتيح للمستخدم تقديم طلب صيانة لفرع أو محل تابع لشبكة العزب.
      يمر بـ UberFix Bot Gateway لإنشاء الطلب في النظام.
    name: "create maintenance request"
    steps:
      - collect: maintenance_client_name
        description: اسم الفرع أو العميل.
        ask_before_filling: false
        reset_after_flow_ends: false
      - collect: maintenance_client_phone
        description: رقم الهاتف لإتمام التواصل.
        ask_before_filling: false
        reset_after_flow_ends: false
      - collect: maintenance_service_type
        description: نوع خدمة الصيانة (كهرباء، سباكة، تكييف، دهانات، إلخ).
        ask_before_filling: false
        reset_after_flow_ends: false
      - collect: maintenance_description
        description: وصف المشكلة أو الطلب بالتفصيل.
        ask_before_filling: false
        reset_after_flow_ends: false
      - collect: maintenance_priority
        description: أولوية الطلب — عالية لو عطل مفاجئ، متوسطة للصيانة الاعتيادية.
        ask_before_filling: false
        reset_after_flow_ends: false
      - action: action_create_maintenance_request
      - action: utter_maintenance_request_created
        next: END

  # ── متابعة حالة طلب ─────────────────────────────────────────
  get_maintenance_status:
    description: >
      استعلام عن حالة طلب صيانة باستخدام رقم الطلب.
    name: "get maintenance status"
    steps:
      - collect: maintenance_request_id
        description: رقم الطلب أو المعرف.
        ask_before_filling: false
        reset_after_flow_ends: false
      - action: action_get_maintenance_status
      - action: utter_maintenance_status
        next: END

  # ── نقل طلب لمرحلة المراجعة ─────────────────────────────────
  triage_maintenance_request:
    description: >
      ينقل طلب صيانة إلى مرحلة المراجعة الفنية (triaged).
      يُستدعى بعد تأكيد استلام الطلب.
    name: "triage maintenance request"
    steps:
      - collect: maintenance_request_id
        description: رقم الطلب المطلوب مراجعته.
        ask_before_filling: false
        reset_after_flow_ends: false
      - action: action_triage_maintenance_request
      - action: utter_maintenance_triaged
        next: END

  # ── تعيين فني للطلب ──────────────────────────────────────────
  assign_maintenance_request:
    description: >
      يعيّن فنياً لطلب الصيانة بعد المراجعة.
    name: "assign maintenance request"
    steps:
      - collect: maintenance_request_id
        description: رقم الطلب المطلوب تعيين فني له.
        ask_before_filling: false
        reset_after_flow_ends: false
      - action: action_assign_maintenance_request
      - action: utter_maintenance_assigned
        next: END
